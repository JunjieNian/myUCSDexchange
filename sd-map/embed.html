<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="__SD_MAP_ASSETS__map.css?v=__SD_MAP_VERSION__">
<section class="sd-map" id="sd-travel-map" aria-labelledby="sd-map-title">
    <header class="sd-map__header">
        <div>
            <h4 id="sd-map-title">圣迭戈游记地图</h4>
            <p>从 UCSD Central Campus 出发</p>
        </div>
        <div class="sd-map__picker">
            <label for="sd-map-place">景点</label>
            <select id="sd-map-place" disabled>
                <option value="">查看全部</option>
            </select>
        </div>
    </header>
    <div class="sd-map__body">
        <div class="sd-map__viewport">
            <div class="sd-map__canvas" role="region" aria-label="圣迭戈景点地图"></div>
            <p class="sd-map__map-message">地图加载中…</p>
            <button class="sd-map__overview" type="button" hidden>查看全部</button>
        </div>
        <div class="sd-map__card" aria-labelledby="sd-map-place-name">
            <div class="sd-map__photo" hidden>
                <p class="sd-map__photo-empty">暂无照片</p>
                <div class="sd-map__photo-gallery" hidden>
                    <button class="sd-map__photo-preview" type="button" aria-haspopup="dialog" aria-label="查看大图">
                        <span class="sd-map__photo-image"></span>
                        <span class="sd-map__photo-enlarge" aria-hidden="true">查看大图</span>
                    </button>
                    <div class="sd-map__photo-nav" role="group" aria-label="浏览照片" hidden>
                        <button class="sd-map__photo-previous" type="button">上一张</button>
                        <span class="sd-map__photo-count" aria-live="polite"></span>
                        <button class="sd-map__photo-next" type="button">下一张</button>
                    </div>
                </div>
            </div>
            <div class="sd-map__details">
                <h5 id="sd-map-place-name" aria-live="polite">UCSD Central Campus</h5>
                <p class="sd-map__description">点地图上的标记，或从景点列表选择，查看游记和从学校出发的路线。</p>
                <div class="sd-map__directions" hidden>
                    <h6>从 UCSD 出发</h6>
                    <ol class="sd-map__steps"></ol>
                    <p class="sd-map__route-note" hidden></p>
                    <a class="sd-map__directions-link" target="_blank" rel="noopener"></a>
                </div>
            </div>
        </div>
    </div>
    <footer class="sd-map__footer">
        <span><i class="sd-map__key sd-map__key--campus" aria-hidden="true"></i> UCSD</span>
        <span><i class="sd-map__key sd-map__key--place" aria-hidden="true"></i> 游记景点</span>
        <span><i class="sd-map__key sd-map__key--walk" aria-hidden="true"></i> 步行段示意</span>
        <a href="https://data.sandiego.gov/datasets/gis-transit-routes/" target="_blank" rel="noopener">公交线路数据</a>
    </footer>
    <dialog class="sd-map__photo-dialog" aria-labelledby="sd-map-photo-title">
        <header class="sd-map__photo-dialog-header">
            <h5 id="sd-map-photo-title"></h5>
            <button class="sd-map__photo-close" type="button" autofocus>关闭</button>
        </header>
        <div class="sd-map__photo-image"></div>
        <div class="sd-map__photo-nav" role="group" aria-label="浏览照片" hidden>
            <button class="sd-map__photo-previous" type="button">上一张</button>
            <span class="sd-map__photo-count" aria-live="polite"></span>
            <button class="sd-map__photo-next" type="button">下一张</button>
        </div>
    </dialog>
    <noscript><p>启用 JavaScript 可查看地图和路线。</p></noscript>
</section>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
<script src="__SD_MAP_ASSETS__map.js?v=__SD_MAP_VERSION__" defer></script>
